name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install test dependencies (no speech model is downloaded)
        run: python -m pip install "numpy>=1.24" "Pillow>=10" "pytest>=8"
      - name: Audit the published files (secrets, personal data, media)
        run: python tools/audit_public_tree.py
      - name: CLI loads
        run: python .claude/skills/claude-autocut/scripts/autocut.py --help
      - name: Tests
        run: python -m pytest -q
