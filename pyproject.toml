[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-autocut"
version = "0.1.0"
description = "Claude Code skill for local automatic video editing, captions and cartoon animation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["faster-whisper>=1.1,<2", "av>=11,<19", "numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
autocut = "claude_autocut.cli:main"

[project.urls]
Homepage = "https://github.com/i0wU/Claude-AutoCut-Skill"

[tool.setuptools.packages.find]
where = [".claude/skills/claude-autocut/scripts"]
include = ["claude_autocut*"]

[tool.setuptools.package-data]
claude_autocut = ["cartoon_template/*", "cartoon_template/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
